name: Refresh camera list

on:
  schedule:
    - cron: "0 9 * * 3" # Every Wednesday at 9 AM UTC
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  refresh:
    name: Fetch and update camera list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Push, PR creation and merge use a GitHub App token, not GITHUB_TOKEN.
    # Runs triggered by github-actions[bot] are held for manual approval, so
    # CI never ran on the refresh PR. Setup: docs/setup/camera-refresh-bot.md
    permissions:
      contents: read

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CAMERA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CAMERA_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch camera list
        id: fetch
        timeout-minutes: 1
        run: bun scripts/fetch-cameras.ts

      - name: Format camera data
        run: bunx prettier --write src/lib/cameras/data.ts

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/lib/cameras/data.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected — camera list is up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected: ${{ steps.fetch.outputs.old_count }} → ${{ steps.fetch.outputs.new_count }} (${{ steps.fetch.outputs.delta }})"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OLD: ${{ steps.fetch.outputs.old_count }}
          NEW: ${{ steps.fetch.outputs.new_count }}
          DELTA: ${{ steps.fetch.outputs.delta }}
          SANITIZED: ${{ steps.fetch.outputs.sanitized_count }}
          HUSKY: 0
        run: |
          BRANCH="chore/refresh-camera-list"
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/lib/cameras/data.ts
          git commit -m "chore(cameras): refresh DOT camera list"
          git push origin "$BRANCH" --force

          BODY="## Summary

          - Automated weekly refresh of the NYC DOT camera list via the DOT webcams API
          - ${OLD} → ${NEW} cameras (${DELTA})
          - ${SANITIZED} camera names sanitized (DOT equipment codes, numeric suffixes, C-code highway names)

          ## Test plan

          - [ ] Review diff in \`src/lib/cameras/data.ts\` — changes should look like additions/removals of camera entries, not wholesale rewrites
          - [ ] A large drop in count may indicate a DOT API issue even if it passed the safety floor"

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q "OPEN"; then
            echo "PR already open for $BRANCH, skipping creation."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(cameras): refresh DOT camera list (${OLD} → ${NEW})" \
              --body "$BODY"
          fi

          # Merges on its own once main's required checks pass. The merge is
          # pushed by the App, so the production deploy on main still runs.
          gh pr merge "$BRANCH" --auto --squash
